name: static-checks
permissions:
  contents: read
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and test
        env:
          QBEE_EMAIL: ${{ secrets.QBEE_API_USER }}
          QBEE_PASSWORD: ${{ secrets.QBEE_API_PASSWORD }}
          QBEE_BASEURL: ${{ secrets.QBEE_API_BASEURL }}
        run: go test ./...
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: golint
        run: go run golang.org/x/lint/golint@latest ./...
      - name: govet
        run: go vet ./...

  # Runs the unit tests on Windows, on the same runner image the release workflow builds the Windows binary on.
  # There are no API credentials here, so the tests which need the API are skipped. The remaining tests cover
  # the code which behaves differently on Windows, such as the handling of local paths.
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
